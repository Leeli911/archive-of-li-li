<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Text2Analytics V2 Architecture</title>
  <desc id="desc">A minimal vertical architecture diagram showing Business Question, Understanding, Execution, Evidence, Facts, Insight, and Structural Completeness.</desc>
  <rect width="1200" height="900" fill="#FFFFFF"/>

  <style>
    .title { font: 600 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #687385; }
    .node-title { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .node-subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #687385; }
    .tag { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.08em; fill: #28549A; }
    .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8A95A5; }
  </style>

  <text x="96" y="72" class="title">Text2Analytics V2 Architecture</text>
  <text x="96" y="104" class="subtitle">Deterministic analytics pipeline from business question to structural completeness.</text>

  <line x1="600" y1="176" x2="600" y2="746" stroke="#C8D0DB" stroke-width="2"/>

  <g transform="translate(360 140)">
    <rect width="480" height="78" rx="14" fill="#F8FAFC" stroke="#DDE4EE"/>
    <text x="240" y="32" text-anchor="middle" class="node-title">Business Question</text>
    <text x="240" y="56" text-anchor="middle" class="node-subtitle">Supported structured analytics request</text>
  </g>
  <path d="M600 228L590 246H610L600 228Z" fill="#28549A"/>

  <g transform="translate(360 250)">
    <rect width="480" height="92" rx="14" fill="#EDF3FC" stroke="#B8C9E4"/>
    <text x="240" y="34" text-anchor="middle" class="node-title">Understanding</text>
    <text x="240" y="60" text-anchor="middle" class="node-subtitle">Intent + Planning</text>
    <text x="240" y="80" text-anchor="middle" class="tag">CANONICAL · INSPECTABLE</text>
  </g>
  <path d="M600 352L590 370H610L600 352Z" fill="#28549A"/>

  <g transform="translate(360 374)">
    <rect width="480" height="92" rx="14" fill="#F8FAFC" stroke="#DDE4EE"/>
    <text x="240" y="34" text-anchor="middle" class="node-title">Execution</text>
    <text x="240" y="60" text-anchor="middle" class="node-subtitle">Generated SQL + DuckDB</text>
    <text x="240" y="80" text-anchor="middle" class="tag">SCHEMA-GROUNDED · READ-ONLY</text>
  </g>
  <path d="M600 476L590 494H610L600 476Z" fill="#28549A"/>

  <g transform="translate(360 498)">
    <rect width="480" height="78" rx="14" fill="#F8FAFC" stroke="#DDE4EE"/>
    <text x="240" y="32" text-anchor="middle" class="node-title">Evidence</text>
    <text x="240" y="56" text-anchor="middle" class="node-subtitle">Backend-agnostic execution artifact</text>
  </g>
  <path d="M600 586L590 604H610L600 586Z" fill="#28549A"/>

  <g transform="translate(360 608)">
    <rect width="480" height="78" rx="14" fill="#F8FAFC" stroke="#DDE4EE"/>
    <text x="240" y="32" text-anchor="middle" class="node-title">Facts</text>
    <text x="240" y="56" text-anchor="middle" class="node-subtitle">Observed facts derived only from evidence</text>
  </g>
  <path d="M600 696L590 714H610L600 696Z" fill="#28549A"/>

  <g transform="translate(360 718)">
    <rect width="480" height="78" rx="14" fill="#F8FAFC" stroke="#DDE4EE"/>
    <text x="240" y="32" text-anchor="middle" class="node-title">Insight</text>
    <text x="240" y="56" text-anchor="middle" class="node-subtitle">Fact-bound interpretation and limitation package</text>
  </g>
  <path d="M600 806L590 824H610L600 806Z" fill="#28549A"/>

  <g transform="translate(360 828)">
    <rect width="480" height="52" rx="14" fill="#172033"/>
    <text x="240" y="32" text-anchor="middle" fill="#FFFFFF" style="font: 600 19px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">Structural Completeness</text>
  </g>

  <g transform="translate(96 782)">
    <rect width="218" height="34" rx="17" fill="#F8FAFC" stroke="#DDE4EE"/>
    <text x="109" y="22" text-anchor="middle" class="small">No LLM in engine path</text>
  </g>
  <g transform="translate(96 828)">
    <rect width="218" height="34" rx="17" fill="#F8FAFC" stroke="#DDE4EE"/>
    <text x="109" y="22" text-anchor="middle" class="small">Deterministic replay</text>
  </g>
</svg>
