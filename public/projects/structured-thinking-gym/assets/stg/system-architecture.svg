<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">STG System Architecture</title>
  <desc id="desc">Layered architecture from Presentation through Controller, Gateway, API, Service, Repository, and Database.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b2b46" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28549a"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="34" fill="#f7f8fa"/>
  <text x="80" y="82" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-1.4">System Architecture</text>
  <text x="80" y="122" fill="#687385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">One product flow separated into presentation, state, transport, orchestration, and persistence boundaries.</text>

  <g filter="url(#shadow)">
    <rect x="350" y="168" width="500" height="70" rx="18" fill="#ffffff" stroke="#c8d0db"/>
    <rect x="350" y="268" width="500" height="70" rx="18" fill="#ffffff" stroke="#c8d0db"/>
    <rect x="350" y="368" width="500" height="70" rx="18" fill="#edf3fc" stroke="#28549a"/>
    <rect x="350" y="468" width="500" height="70" rx="18" fill="#ffffff" stroke="#c8d0db"/>
    <rect x="350" y="568" width="500" height="70" rx="18" fill="#ffffff" stroke="#c8d0db"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="600" y="198" text-anchor="middle" fill="#172033" font-size="24" font-weight="700">Presentation</text>
    <text x="600" y="220" text-anchor="middle" fill="#687385" font-size="15">Training UI and visual explanation</text>
    <text x="600" y="298" text-anchor="middle" fill="#172033" font-size="24" font-weight="700">Controller</text>
    <text x="600" y="320" text-anchor="middle" fill="#687385" font-size="15">State, validation, idempotency, recovery</text>
    <text x="600" y="398" text-anchor="middle" fill="#172033" font-size="24" font-weight="700">Gateway</text>
    <text x="600" y="420" text-anchor="middle" fill="#687385" font-size="15">Stable session interface for Demo and Live</text>
    <text x="600" y="498" text-anchor="middle" fill="#172033" font-size="24" font-weight="700">API → Service → Repository</text>
    <text x="600" y="520" text-anchor="middle" fill="#687385" font-size="15">Live transport, workflow orchestration, persistence adapter</text>
    <text x="600" y="598" text-anchor="middle" fill="#172033" font-size="24" font-weight="700">Database</text>
    <text x="600" y="620" text-anchor="middle" fill="#687385" font-size="15">Training sessions and revision records</text>
  </g>

  <g stroke="#28549a" stroke-width="3" marker-end="url(#arrow)">
    <line x1="600" y1="238" x2="600" y2="264"/>
    <line x1="600" y1="338" x2="600" y2="364"/>
    <line x1="600" y1="438" x2="600" y2="464"/>
    <line x1="600" y1="538" x2="600" y2="564"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#28549a">
    <rect x="80" y="604" width="214" height="38" rx="19" fill="#edf3fc" stroke="#dfe4eb"/>
    <text x="187" y="628" text-anchor="middle">Shared DTO boundary</text>
    <rect x="906" y="604" width="214" height="38" rx="19" fill="#edf3fc" stroke="#dfe4eb"/>
    <text x="1013" y="628" text-anchor="middle">No UI-to-API shortcut</text>
  </g>
</svg>
