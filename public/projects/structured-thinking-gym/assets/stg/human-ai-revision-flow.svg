<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Human-AI Revision Flow</title>
  <desc id="desc">Draft moves into explainable feedback, user decision, revision event, final attempt, AI re-score, and completed result.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1b2b46" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28549a"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="34" fill="#f7f8fa"/>
  <text x="70" y="78" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="-1.4">Human-AI Revision Flow</text>
  <text x="70" y="116" fill="#687385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">The learner writes and decides. AI evaluates, explains, suggests, and re-scores.</text>

  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="70" y="190" width="144" height="92" rx="18" fill="#f2f8f5" stroke="#9fd9bd"/>
    <rect x="254" y="190" width="174" height="92" rx="18" fill="#edf3fc" stroke="#9cb8e6"/>
    <path d="M 510 184 L 620 236 L 510 288 L 400 236 Z" fill="#ffffff" stroke="#c8d0db"/>
    <rect x="672" y="190" width="154" height="92" rx="18" fill="#fff7ed" stroke="#f0c58f"/>
    <rect x="866" y="190" width="144" height="92" rx="18" fill="#f2f8f5" stroke="#9fd9bd"/>
    <rect x="1048" y="190" width="112" height="92" rx="18" fill="#edf3fc" stroke="#9cb8e6"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#172033">
    <text x="142" y="229" text-anchor="middle" font-size="20" font-weight="700">Draft</text>
    <text x="142" y="254" text-anchor="middle" fill="#687385" font-size="13">initial answer</text>
    <text x="341" y="224" text-anchor="middle" font-size="19" font-weight="700">Explainable</text>
    <text x="341" y="248" text-anchor="middle" font-size="19" font-weight="700">Feedback</text>
    <text x="341" y="270" text-anchor="middle" fill="#687385" font-size="13">score + evidence</text>
    <text x="510" y="225" text-anchor="middle" font-size="18" font-weight="700">Accept</text>
    <text x="510" y="248" text-anchor="middle" font-size="18" font-weight="700">Reject / Edit</text>
    <text x="749" y="225" text-anchor="middle" font-size="19" font-weight="700">Revision</text>
    <text x="749" y="249" text-anchor="middle" font-size="19" font-weight="700">Event</text>
    <text x="938" y="225" text-anchor="middle" font-size="19" font-weight="700">Final</text>
    <text x="938" y="249" text-anchor="middle" font-size="19" font-weight="700">Attempt</text>
    <text x="1104" y="225" text-anchor="middle" font-size="18" font-weight="700">AI</text>
    <text x="1104" y="249" text-anchor="middle" font-size="18" font-weight="700">Re-score</text>
  </g>

  <g stroke="#28549a" stroke-width="3" marker-end="url(#arrow)">
    <line x1="214" y1="236" x2="246" y2="236"/>
    <line x1="428" y1="236" x2="454" y2="236"/>
    <line x1="566" y1="236" x2="664" y2="236"/>
    <line x1="826" y1="236" x2="858" y2="236"/>
    <line x1="1010" y1="236" x2="1040" y2="236"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="420" y="374" width="360" height="72" rx="18" fill="#ffffff" stroke="#c8d0db"/>
    <text x="600" y="404" text-anchor="middle" fill="#172033" font-size="22" font-weight="700">Completed</text>
    <text x="600" y="428" text-anchor="middle" fill="#687385" font-size="15">final answer plus updated score</text>
    <path d="M 1104 282 C 1104 356 790 356 742 374" fill="none" stroke="#28549a" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
